name: daydeck
description: "DayDeck — a terminal-styled daily dashboard (Android + web)"
# Prevent accidental publishing to pub.dev
publish_to: 'none'
version: 0.9.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  http: ^1.2.2
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  home_widget: ^0.10.0
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

# Generates the Android launcher icons (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/daydeck_icon.png"
  adaptive_icon_background: "#0f1117"
  adaptive_icon_foreground: "assets/icon/daydeck_icon_foreground.png"
  min_sdk_android: 24
