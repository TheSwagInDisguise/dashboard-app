name: release

# Builds a signed release APK and publishes it to GitHub Releases whenever a
# version tag (vX.Y.Z) is pushed. Also runs on manual dispatch so the build
# can be exercised without cutting a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # needed to create the Release and upload the APK

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter (3.47.9 stable — same version used in local dev)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Decode signing keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, sys
          data = os.environ.get('ANDROID_KEYSTORE_BASE64', '')
          if not data.strip():
              sys.exit('ANDROID_KEYSTORE_BASE64 is not set — see PROJECT_NOTES.md#secrets')
          raw = base64.b64decode(data)
          with open('android/app/keystore.p12', 'wb') as f:
              f.write(raw)
          print(f'keystore decoded ({len(raw)} bytes)')
          PY

      - name: Configure release signing (key.properties — never committed)
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          {
            printf 'storeFile=keystore.p12\n'
            printf 'storePassword=%s\n' "$STORE_PASS"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASS"
          } > android/key.properties
          echo "key.properties written (values intentionally not shown)"

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: DayDeck ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true

      - name: Upload APK artifact (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: daydeck-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
